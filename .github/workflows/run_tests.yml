name: Automated API tests

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Run API tests for checking entity management
        required: true
        default: all_tests
        type: choice
        options:
          - test_create_object
          - test_delete_object
          - test_get_object
          - test_get_all_objects
          - test_update_object
          - all_tests

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  download-history:
    runs-on: ubuntu-latest
    name: Download history
    steps:
      - name: setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: >
          ARTIFACT_ID=$(curl -L
          -H "Accept: application/json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/solar-owl/Practice_SDET_API/actions/artifacts?names=allure-results"
          | python -c "import sys, json; print(json.load(sys.stdin)['artifacts'][0]['id']);")
          &&
          curl -L
          -H "Accept: application/json"
          -H "Authorization: Bearer ${{secrets.TOKEN}}"
          -H "X-GitHub-Api-Version: 2022-11-28"
          https://api.github.com/repos/solar-owl/Practice_SDET_API/actions/artifacts/$ARTIFACT_ID/zip
          -o artifacts
          &&
          REPORT_ID=$(curl -L
          -H "Accept: application/json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/solar-owl/Practice_SDET_API/actions/artifacts?names=github-pages"
          | python -c "import sys, json; print(json.load(sys.stdin)['artifacts'][0]['id']);")
          &&
          curl -L
          -H "Accept: application/json"
          -H "Authorization: Bearer ${{secrets.TOKEN}}"
          -H "X-GitHub-Api-Version: 2022-11-28"
          https://api.github.com/repos/solar-owl/Practice_SDET_API/actions/artifacts/$REPORT_ID/zip 
          -o pages.zip
      - run: mkdir old-allure-results && unzip artifacts -d old-allure-results
      - run: mkdir old_pages pages_history&& unzip pages.zip -d old_pages && tar -xvf old_pages/artifact.tar -C pages_history
      - run: cp pages_history/history/* old-allure-results && cp -r pages_history/history old-allure-results
      - name: Store allure history
        uses: actions/upload-artifact@v4
        with:
          name: old-allure-results
          path: old-allure-results
          retention-days: 1


  test:
    runs-on: ubuntu-latest
    needs: download-history
    name: Test
    steps:
      - name: Clone project
        uses: actions/checkout@v3
        with:
          repository: 'bondarenkokate73/simbirsoft_sdet_project'
          path: 'project'
      - name: Install Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Start project with Docker Compose
        run: |
          cd project
          docker compose config
          docker compose up --build -d
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - name: Run tests
        run: pytest --alluredir=allure-result
        continue-on-error: true
      - name: test_create_object
        if: "github.event.inputs.deployment_target == 'test_create_object'"
        run: pytest tests/test_run.py::test_create_object --alluredir=allure-result
        continue-on-error: true
      - name: test_delete_object
        if: "github.event.inputs.deployment_target == 'test_delete_object'"
        run: pytest tests/test_run.py::test_delete_object --alluredir=allure-result
        continue-on-error: true
      - name: test_get_object
        if: "github.event.inputs.deployment_target == 'test_get_object'"
        run: pytest tests/test_run.py::test_get_object --alluredir=allure-result
        continue-on-error: true
      - name: test_get_all_objects
        if: "github.event.inputs.deployment_target == 'test_get_all_objects'"
        run: pytest tests/test_run.py::test_get_all_objects --alluredir=allure-result
        continue-on-error: true
      - name: test_update_object
        if: "github.event.inputs.deployment_target == 'test_update_object'"
        run: pytest tests/test_run.py::test_update_object --alluredir=allure-result
        continue-on-error: true
      - name: all_tests
        if: "github.event.inputs.deployment_target == 'all_tests'"
        run: pytest --alluredir=allure-result
        continue-on-error: true
      - name: Merge allure results
        run: mkdir allure-results && cp -R allure-result/* allure-results && cp -R old-allure-results/* allure-results
      - name: Store allure result
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  generate-report:
    runs-on: ubuntu-latest
    needs: test
    name: Generate report
    steps:
      - uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: '17'
      - run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.33.0/allure-2.33.0.tgz && sudo tar -zxvf allure-2.33.0.tgz -C /opt/ && sudo ln -s /opt/allure-2.33.0/bin/allure /usr/bin/allure
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - run: allure generate -c allure-results -o _site
      - name: Store generated report
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path:
            _site
          retention-days: 1

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    name: Publish report
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4